<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leitor de XML</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint, para não piscar claro ao
      // recarregar no modo escuro. Mesma chave de src/tema/ContextoTema.tsx.
      try {
        if (localStorage.getItem("leitor-xml:tema") === "escuro") {
          document.documentElement.dataset.tema = "escuro";
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
