services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nfe_sistema}
      MYSQL_USER: ${MYSQL_USER:-nfe_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nfe_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (usado pela API/worker para enviar e-mail)
      - "8025:8025" # UI web para ver os e-mails capturados

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
      - nfe_uploads:/tmp/nfe_uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - .:/code
      - nfe_uploads:/tmp/nfe_uploads
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      # Não usar env_file: .env aqui: o .env define API_BASE_URL para o
      # backend (http://localhost:8000, usado nos links de aprovação
      # clicados no navegador do host). Dentro do container do Streamlit,
      # "localhost" é o próprio container -- a API só é alcançável pelo
      # nome do serviço na rede do Compose.
      - API_BASE_URL=http://api:8000
    volumes:
      - .:/code
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      # Inverso do serviço `frontend`: o React roda no browser do HOST, não
      # dentro do container, então "api" (nome do serviço na rede do
      # Compose) não resolve para o browser -- precisa ser localhost:8000.
      # Trocar isso por engano (copiando o padrão do `frontend` acima) dá um
      # erro de rede difícil de diagnosticar.
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./web:/code
      - web_node_modules:/code/node_modules
    depends_on:
      - api

volumes:
  db_data:
  nfe_uploads:
  web_node_modules:
